services:
  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile
    env_file:
      - .env
    # Host-side port from .env (default 8000) maps to container's 8000.
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Bind mount source for live reload; edit on host, runs in container.
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload